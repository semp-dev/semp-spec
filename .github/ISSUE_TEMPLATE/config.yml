blank_issues_enabled: false
contact_links:
  - name: Security disclosure
    url: mailto:security@semp.dev
    about: Report a protocol-design vulnerability privately. Do NOT open a public issue.
  - name: Code of Conduct concern
    url: mailto:conduct@semp.dev
    about: Report a Code of Conduct violation privately.
  - name: Library bug (Go reference implementation)
    url: https://github.com/semp-dev/semp-go/issues/new/choose
    about: Bugs in the Go reference library belong on semp-go.
  - name: Question / discussion
    url: https://github.com/semp-dev/semp-spec/discussions
    about: For open-ended design questions, please use Discussions.
